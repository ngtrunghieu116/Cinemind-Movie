services:
  crawler-service:
    build:
      context: ./crawler-service
      dockerfile: Dockerfile
    container_name: cinemind-crawler
    ports:
      - "8002:8002"
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_NAME=movie_reservation_db
      - DB_USER=root
      - DB_PASSWORD=root
      - NCC_BASE_URL=https://chieuphimquocgia.com.vn
      - TMDB_API_KEY=2dca580c2a14b55200e784d157207b4d
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  chatbot-service:
    build:
      context: ./chatbot-service
      dockerfile: Dockerfile
    container_name: cinemind-chatbot
    ports:
      - "8001:8001"
    environment:
      - CLOUD_MODEL_NAME=deepseek-chat
      - CLOUD_MODEL_URL=https://api.deepseek.com
      - CLOUD_API_KEY=${CLOUD_API_KEY:-your_deepseek_api_key_here}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-your_deepseek_api_key_here}
      - DEEPSEEK_BASE_URL=https://api.deepseek.com
      - DEEPSEEK_MODEL=deepseek-chat
      - EMBEDDING_MODEL=jeffh/intfloat-multilingual-e5-large-instruct:Q8_0
      - RERANKER_MODEL=models--namdp-ptit--ViRanker
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - DEVICE=cpu
      - QDRANT_HOST=host.docker.internal
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=movie_knowledge
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=movie_reservation_db
      - LANGFUSE_SECRET_KEY=sk-lf-1efab906-7b70-4bbb-a819-700038f86cc2
      - LANGFUSE_PUBLIC_KEY=pk-lf-76a43571-d108-4fb0-846e-524129ae6fb4
      - LANGFUSE_BASE_URL=http://host.docker.internal:3300
      - LANGFUSE_HOST=http://host.docker.internal:3300
      - APP_HOST=0.0.0.0
      - APP_PORT=8001
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001,http://localhost:5173
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  huggingface-cache:
